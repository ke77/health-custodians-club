<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline | HCC Dashboard</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #ffffff;
        color: #17191a;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      main { max-width: 26rem; }
      img { width: 72px; height: 72px; }
      h1 { margin: 24px 0 8px; font-size: 1.5rem; font-weight: 600; }
      p { margin: 0; line-height: 1.6; color: #5b5e5c; }
      button {
        margin-top: 28px;
        min-height: 44px;
        padding: 0 28px;
        border: 0;
        border-radius: 8px;
        background: #17191a;
        color: #ffffff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>The dashboard shows live applications and enquiries, so it needs a connection. Check your signal, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
