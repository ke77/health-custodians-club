<!--
  paste into Supabase: Authentication → Email Templates → Magic Link (signInWithOtp uses this template).
  subject: Your HCC sign-in code
-->
<div style="margin:0;padding:32px 24px;background:#ffffff;font-family:Arial,Helvetica,sans-serif;color:#17191a;">
  <div style="max-width:480px;margin:0 auto;">
    <p style="margin:0 0 24px;font-family:Georgia,serif;font-size:22px;">HCC</p>
    <p style="margin:0 0 16px;font-size:16px;line-height:1.6;">Your code to sign in to the Health Custodians Club dashboard:</p>
    <p style="margin:0 0 24px;padding:16px 20px;background:#f3efe6;border-radius:3px;font-family:'Courier New',monospace;font-size:28px;letter-spacing:8px;">{{ .Token }}</p>
    <p style="margin:0 0 8px;font-size:14px;line-height:1.6;color:#5b5e5c;">It expires in 10 minutes. If you did not ask for it, you can ignore this email.</p>
  </div>
</div>
